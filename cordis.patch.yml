# Bundle patch layer for dsh-llm-probe.
#
# The row loads this package's main entry as the Host half (a plain Cordis
# plugin); `dsh.client` in package.json makes the web app load ./client as the
# browser half (sidebar entry + native toolbar panel).
#
# 可覆盖的配置（均带默认值，全部可省略）：
#   toolDir:   巡检工具所在目录（须含 server.mjs / probe.mjs）。
#              留空时自动探测：环境变量 LLM_PROBE_DIR → 本插件包的上一级目录。
#              把本插件放在巡检工具目录内（<toolDir>/dsh-llm-probe）时留空即可。
#   port:      巡检服务端口，默认 8787
#   autoStart: Host 半部是否在首次需要时拉起 server.mjs，默认 true
- insert:
    - id: llm-probe
      name: 'dsh-llm-probe'
      config:
        toolDir: ''
        port: 8787
        autoStart: true
