# Bundle patch layer for dsh-llm-probe.
#
# The row loads this package's main entry as the Host half (a plain Cordis
# plugin); `dsh.client` in package.json makes the web app load ./client as the
# browser half (sidebar entry + native toolbar panel).
#
# 可覆盖的配置（均带默认值，全部可省略）：
#   dataDir:   数据目录（catalog / keys / overrides / out / media）。
#              留空时用 $DSH_HOME/llm-probe，再否则 ~/.dsh/llm-probe。
#              引擎脚本随插件分发（engine/），不需要用户自备 probe.mjs。
#   port:      巡检服务端口，默认 8787
#   autoStart: Host 半部是否在首次需要时拉起内嵌引擎，默认 true
#   schedule:  auto（默认）= DSH 运行期间每 probeInterval 分钟自动巡检一轮；
#              off = 只手动巡检。不依赖 Windows 计划任务。
- insert:
    - id: llm-probe
      name: 'dsh-llm-probe'
      config:
        dataDir: ''
        port: 8787
        autoStart: true
        schedule: auto
